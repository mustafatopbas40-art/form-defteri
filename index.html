<title>Form Defteri</title>
<style>
/* Layout: kayıt defteri hissi. Üstte sabit başlık, ortada tek sütun içerik, altta 5 sekmeli çubuk; formlar alttan açılan sayfalarda. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface2:#E2E7EC; --ink:#10171D; --ink2:#586470; --line:#D2D9E0;
  --accent:#E8430F; --accent-ink:#FFFFFF;
  --p:#2B67E0; --c:#D39200; --f:#C93A66; --ok:#1C8A57; --bad:#C3271B;
  --shadow:0 -12px 40px rgba(16,23,29,.22);
  color-scheme:light;
  --display:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Roboto Condensed','sans-serif-condensed','Arial Narrow',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1215; --surface:#171C20; --surface2:#222930; --ink:#EDF1F4; --ink2:#9AA7B2; --line:#2A323A;
    --accent:#FF6A3A; --accent-ink:#1C0A03;
    --p:#6B9BFF; --c:#F0B429; --f:#F2759B; --ok:#4CC38A; --bad:#FF6B5E;
    --shadow:0 -12px 40px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#171C20; --surface2:#222930; --ink:#EDF1F4; --ink2:#9AA7B2; --line:#2A323A;
  --accent:#FF6A3A; --accent-ink:#1C0A03;
  --p:#6B9BFF; --c:#F0B429; --f:#F2759B; --ok:#4CC38A; --bad:#FF6B5E;
  --shadow:0 -12px 40px rgba(0,0,0,.65);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 104px}

/* üst başlık */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font:700 24px/1 var(--display);letter-spacing:.05em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.status{white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--ink2);min-height:34px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.status.cloud::before{background:var(--ok)}
.status.local::before{background:var(--ok)}
.status.error::before{background:var(--bad)}

/* düğmeler ve alanlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.icon{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.icon svg{width:20px;height:20px}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px}
.fld{display:grid;gap:4px;margin-bottom:12px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld select,.fld textarea,.search{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.search{background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:10px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar .search{flex:1}

/* gün seçici */
.daynav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-bottom:16px}
.dn-mid{text-align:center;display:grid;line-height:1.1}
.dn-mid b{font:700 28px/1 var(--display);letter-spacing:.02em}
.dn-mid span{font-size:13px;color:var(--ink2)}
.dn-mid .link{padding:2px 0;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}

/* bugün özeti */
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kcal{font:700 76px/.85 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kcal small{font:600 18px var(--body);color:var(--ink2);letter-spacing:0;margin-left:6px}
.rem{text-align:right;font-size:13px;color:var(--ink2)}
.rem b{display:block;font:700 26px/1 var(--display);color:var(--ink)}
.rem.over b{color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w,0%);background:var(--col,var(--accent));border-radius:99px}
.hero .bar{margin-block:14px 18px;height:10px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mac b{display:block;font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.mac .v{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.mac .v small{font:500 12px var(--body);color:var(--ink2)}
.mac .bar{margin-top:6px;height:6px}
.share{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:18px;gap:2px}
.share i{display:block;height:100%}
.share-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}

/* öğünler */
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h h3{font:700 22px/1 var(--display);letter-spacing:.03em;flex:1}
.meal-h .mk{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;margin-top:10px}
.entry:first-of-type{margin-top:10px}
.entry .en{font-weight:500;overflow-wrap:anywhere}
.entry .es{font-size:12px;color:var(--ink2)}
.entry .ek{grid-row:1/3;grid-column:2;text-align:right;font:700 20px/1.1 var(--display);font-variant-numeric:tabular-nums}
.entry .ek small{display:block;font:500 11px var(--body);color:var(--ink2)}
.empty{font-size:13px;color:var(--ink2);padding:12px 0 2px;border-top:1px solid var(--line);margin-top:10px}

/* satır listeleri */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;width:100%}
.row:first-child{border-top:0}
.row b{font-weight:500;overflow-wrap:anywhere}
.row small{color:var(--ink2);font-size:12px;display:block}
.row .rk{font:700 20px/1.1 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.row .rk small{font:500 11px var(--body)}
.blank{padding:28px 8px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:10px}
.blank b{display:block;font:700 22px var(--display);color:var(--ink);margin-bottom:4px}

/* hareket kütüphanesi */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.xcard{display:grid;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0}
.xcard .tm{aspect-ratio:4/3;width:100%;max-width:100%}
.xcard .xt{padding:10px 12px}
.xcard b{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.xcard small{color:var(--ink2);font-size:12px}
.tm{display:block;object-fit:cover;background:var(--surface2)}
.ph{display:grid;place-items:center;font:700 38px var(--display);letter-spacing:.04em;color:var(--ink2);background:repeating-linear-gradient(135deg,var(--surface2) 0 9px,var(--bg) 9px 18px)}
.tm.sm{width:48px;height:48px;border-radius:8px;flex:0 0 48px;font-size:18px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2)}

/* antrenman */
.wsum{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.wsum div{display:grid;line-height:1.05}
.wsum b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.wsum span{font-size:12px;color:var(--ink2)}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wk-t{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0;flex:1}
.wk-t b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.02em;overflow-wrap:anywhere}
.wk-t small{color:var(--ink2);font-size:12px}
.last{font-size:12px;color:var(--ink2);margin-top:10px}
.sets{margin-top:10px;display:grid;gap:6px}
.sh,.sr{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.sh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:center}
.sn{font:700 20px var(--display);text-align:center;color:var(--ink2)}
.si{width:100%;min-width:0;text-align:center;font:600 22px var(--display);padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);height:44px}
.sr.done .si{border-color:var(--ok)}
.tick{height:44px;width:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.tick svg{width:22px;height:22px}
.sr.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.wk-f{display:flex;gap:8px;margin-top:12px}

/* ilerleme */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile b{display:block;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile b small{font:500 13px var(--body);color:var(--ink2)}
.tile span{font-size:12px;color:var(--ink2)}
.card h2,.sect{font:700 22px/1 var(--display);letter-spacing:.03em;margin-bottom:12px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink2);font:10px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 4}
.chart .b{fill:var(--ink2);opacity:.45}
.chart .b.t{fill:var(--accent);opacity:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.l{fill:var(--accent)}

/* alt sekmeler */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:grid;justify-items:center;gap:2px;padding:7px 2px 5px;background:none;border:0;border-radius:8px;font-size:11px;font-weight:600;color:var(--ink2);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* alttan açılan sayfa */
.sheet-root{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(8,12,15,.6)}
.sheet{position:relative;width:100%;max-width:720px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.sheet-h h2{font:700 26px/1 var(--display);letter-spacing:.03em}
.sheet-body{overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.sheet-body h3{font:700 24px/1.1 var(--display);margin-bottom:4px;overflow-wrap:anywhere}
.qty{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;margin:12px 0}
.qty button{height:48px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:22px;font-weight:600}
.qty input{height:48px;text-align:center;font:700 26px var(--display);border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.prev{font-size:14px;margin-bottom:14px;padding:10px 12px;background:var(--bg);border-radius:8px;font-variant-numeric:tabular-nums}
.stack{display:grid;gap:10px;margin-top:6px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:14px}
.gallery>*{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.gallery img,.gallery video{width:100%;max-height:56vh;object-fit:contain;background:#000;border-radius:8px;display:block}
.glink{display:grid;place-items:center;min-height:140px;border:1px dashed var(--line);border-radius:8px;text-align:center;padding:16px;color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.mtile{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;font-size:11px;color:var(--ink2);text-align:center;padding:4px}
.mtile img,.mtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mtile button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(8,12,15,.75);color:#fff;display:grid;place-items:center;padding:0}
.mtile button svg{width:16px;height:16px}
.urlrow{display:flex;gap:8px;margin-top:10px}
.urlrow input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.hint{font-size:12px;color:var(--ink2);margin:8px 0}
.note{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  .bar>i{transition:width .3s ease}
}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:380px){.kcal{font-size:64px}.two{grid-template-columns:1fr}}
</style>
</head>

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:null};
const nz=v=>num(v)||0;
const fmt=(n,d)=>Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:d==null?0:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

/* ---------- kayıt katmanı (IndexedDB, tamamen cihazda) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('noidb'));return}
    const r=indexedDB.open('form-defteri',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs');d.createObjectStore('media')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
  })},
  run(store,mode,fn){return new Promise((res,rej)=>{
    const t=this.db.transaction(store,mode),s=t.objectStore(store),req=fn(s);
    t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  })},
  all(store){return new Promise((res,rej)=>{
    const t=this.db.transaction(store,'readonly'),s=t.objectStore(store),k=s.getAllKeys(),v=s.getAll();
    t.oncomplete=()=>{const o={};k.result.forEach((key,i)=>{o[key]=v.result[i]});res(o)};t.onerror=()=>rej(t.error);
  })},
  put(store,key,val){return this.run(store,'readwrite',s=>s.put(val,key))},
  del(store,key){return this.run(store,'readwrite',s=>s.delete(key))},
  get(store,key){return this.run(store,'readonly',s=>s.get(key))},
  keys(store){return this.run(store,'readonly',s=>s.getAllKeys())}
};
const Store={
  idb:false,
  put(id,data,opts){S.docs[id]=data;const p=this.save(id);if(!(opts&&opts.silent))safeRender();return p},
  del(id){delete S.docs[id];const p=this.save(id);safeRender();return p},
  save(id){
    if(this.idb){
      const d=S.docs[id];
      return (d?DB.put('docs',id,d):DB.del('docs',id)).catch(()=>{setStatus('error');toast('Kaydedilemedi')});
    }
    saveLocal();return Promise.resolve();
  }
};
function saveLocal(){try{localStorage.setItem('formdefteri.v1',JSON.stringify(S.docs))}catch(e){setStatus('error')}}
function loadLocal(){try{const t=localStorage.getItem('formdefteri.v1');if(t){const o=JSON.parse(t);if(o&&typeof o==='object')return o}}catch(e){}return {}}

function mutateDay(date,fn,opts){

  cur.meals=cur.meals||[];cur.workout=cur.workout||[];

}

const URLS={},URLP={};
const hasMedia=m=>m.k==='asset'||(m.k==='data'&&!!m.src);
const mediaSrc=m=>m.k==='data'?m.src:'';
const srcAttr=m=>m.k==='data'?' src="'+esc(m.src)+'"':'';
const mid=m=>m.k==='asset'?' data-mid="'+esc(m.id)+'"':'';
function blobUrl(id){
  if(URLS[id])return Promise.resolve(URLS[id]);
  if(URLP[id])return URLP[id];
  URLP[id]=DB.get('media',id).then(r=>{if(!r||!r.blob)return '';const u=URL.createObjectURL(r.blob);URLS[id]=u;return u}).catch(()=>'');
  return URLP[id];
}
function hydrate(){
  document.querySelectorAll('[data-mid]:not([data-ok])').forEach(el=>{
    el.setAttribute('data-ok','1');
    blobUrl(el.getAttribute('data-mid')).then(u=>{if(u)el.src=el.tagName==='VIDEO'?u+'#t=0.1':u});
  });
}

new MutationObserver(()=>{if(hyQ)return;hyQ=true;requestAnimationFrame(()=>{hyQ=false;hydrate()})}).observe(document.documentElement,{childList:true,subtree:true});

  const ini=ex&&ex.name?Array.from(ex.name.trim()).slice(0,2).join('').toLocaleUpperCase('tr'):'?';
  return '<div class="'+c+' ph" aria-hidden="true">'+esc(ini)+'</div>';

  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Son 14 günün kalori grafiği"><line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  data.forEach((x,i)=>{
    const h=x.k/max*ch,bx=pl+i*bw+bw*.18;
    if(x.k>0)s+='<rect class="b'+(x.today?' t':'')+'" x="'+bx.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>';
    s+='<text x="'+(pl+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle"'+(x.today?' style="font-weight:700"':'')+'>'+parse(x.d).getDate()+'</text>';
  });
  s+='<line class="goal" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'"/><text x="'+(W-pr)+'" y="'+(gy-4).toFixed(1)+'" text-anchor="end">hedef '+fmt(goal)+'</text></svg>';
  return s;
}
function weightChart(pts){

  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Vücut ağırlığı grafiği">';

  s+='<text x="'+(pl-6)+'" y="'+(Y(hi)+3)+'" text-anchor="end">'+fmt(hi,1)+'</text><text x="'+(pl-6)+'" y="'+(Y(lo)+3)+'" text-anchor="end">'+fmt(lo,1)+'</text>';
  s+='<polyline class="ln" points="'+pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.w).toFixed(1)).join(' ')+'"/>';

}

  const last7=days.slice(7).map(d=>({d:d,t:sumMeals(getDay(d).meals)})).filter(x=>x.t.kcal>0);
  const avg=k=>last7.length?last7.reduce((a,x)=>a+x.t[k],0)/last7.length:0;
  const trained=days.slice(7).filter(d=>getDay(d).workout.some(e=>(e.sets||[]).some(s=>s.done))).length;
  const wpts=dayIds().filter(d=>getDay(d).weight!=null).slice(-30).map(d=>({d:d,w:getDay(d).weight}));
  const lastW=wpts.length?wpts[wpts.length-1].w:null;
  let h='<div class="tiles">'+
    '<div class="tile"><b>'+trained+'<small> / 7 gün</small></b><span>Antrenman yapılan gün</span></div>'+
    '<div class="tile"><b>'+(lastW==null?'–':fmt(lastW,1))+'<small> kg</small></b><span>Son kayıtlı ağırlık</span></div>'+
    '<div class="tile"><b>'+(last7.length?fmt(avg('kcal')):'–')+'<small> kcal</small></b><span>7 günlük ortalama</span></div>'+
    '<div class="tile"><b>'+(last7.length?fmt(avg('p')):'–')+'<small> g</small></b><span>Günlük protein ortalaması</span></div></div>';
  h+='<div class="card"><h2>Kalori · son 14 gün</h2>'+kcalChart(data,g.kcal)+'</div>';
  h+='<div class="card"><h2>Vücut ağırlığı</h2>'+(wpts.length>=2?weightChart(wpts):'<p class="muted">Grafik için en az iki gün ağırlık gir. Bugün sekmesinin altında ağırlık alanı var.</p>')+'</div>';
  return h;
}

async function toBlob(file,max,q){
  let bmp;
  try{bmp=await createImageBitmap(file)}catch(e){
    bmp=await new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>res(im);im.onerror=rej;im.src=u});
  }
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q));
}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function dropAsset(id){try{if(S.assets)await S.assets.delete(id)}catch(e){}}

  const orig=id?S.docs[id]:null;
  const ex=orig?clone(orig):{kind:'ex',name:'',muscle:'',equip:'',sets:'3',reps:'10',note:'',media:[]};
  ex.media=ex.media||[];
  const origIds=new Set(ex.media.filter(m=>m.k==='asset').map(m=>m.id));

  const muscles=Array.from(new Set(exercises().map(e=>e.muscle).filter(Boolean)));

  openSheet(orig?'Hareketi düzenle':'Yeni hareket',

    '<label class="btn wide" for="xe-file" id="xe-lbl">Fotoğraf'+(S.assets?' / video':'')+' ekle</label><input class="vh" type="file" id="xe-file" accept="'+accept+'" multiple>'+
    '<p class="hint" id="xe-hint">'+(S.assets?'Fotoğraf ve videolar yalnızca bu cihazda saklanır. Video en fazla 200 MB olabilir.':'Bu görünümde yalnızca küçültülmüş fotoğraf eklenebilir. Video için aşağıya bağlantı yapıştır.')+'</p>'+
    '<div class="urlrow"><input id="xe-url" type="url" inputmode="url" placeholder="Video bağlantısı (YouTube vb.)" autocomplete="off"><button class="btn" id="xe-urlbtn">Ekle</button></div>'+
    '<div class="stack" style="margin-top:20px"><button class="btn primary wide" id="xe-save">Kaydet</button>'+(orig?'<button class="btn danger wide" id="xe-del">Hareketi sil</button>':'')+'</div>',
  body=>{
    const mbox=$('#xe-media',body),lbl=$('#xe-lbl',body);
    const drawMedia=()=>{
      mbox.innerHTML=ex.media.length?'<div class="mgrid">'+ex.media.map((m,i)=>{
        let inner;
        if(m.k==='url'){let host=m.href;try{host=new URL(m.href).hostname}catch(e){}inner='Video bağlantısı<br>'+esc(host)}
        else if(m.t==='video')inner='<video'+mid(m)+' muted playsinline preload="metadata"></video>';
        else inner='<img'+mid(m)+srcAttr(m)+' alt="">';
        return '<div class="mtile">'+inner+'<button data-rm="'+i+'" aria-label="Kaldır">'+IC.x+'</button></div>';
      }).join('')+'</div>':'';
    };
    drawMedia();
    mbox.addEventListener('click',e=>{
      const b=e.target.closest('[data-rm]');if(!b)return;
      const m=ex.media.splice(Number(b.dataset.rm),1)[0];
      if(m&&m.k==='asset'&&added.indexOf(m.id)>=0){added.splice(added.indexOf(m.id),1);dropAsset(m.id)}
      drawMedia();
    });
    $('#xe-file',body).addEventListener('change',async ev=>{
      const files=Array.from(ev.target.files||[]);ev.target.value='';
      if(!files.length)return;
      lbl.textContent='Yükleniyor…';lbl.setAttribute('aria-busy','true');
      for(const file of files){
        try{
          const isVid=/^video\//.test(file.type)||/\.(mp4|mov|webm|m4v)$/i.test(file.name);
          if(isVid){
            if(!S.assets){toast('Video yüklemek bu görünümde kapalı. Bağlantı ekle.');continue}
            if(file.size>200*1024*1024){toast('Video 200 MB’dan büyük. Kısalt ya da bağlantı ekle.');continue}
            const type=/webm/.test(file.type)||/\.webm$/i.test(file.name)?'video/webm':'video/mp4';
            const r=await S.assets.upload(file,{type:type});
            ex.media.push({k:'asset',t:'video',id:r.id});added.push(r.id);
          }else{
            let blob=null;
            try{blob=await toBlob(file,S.assets?1600:900,S.assets?.82:.7)}catch(e){
              if(S.assets&&/^image\/(png|jpeg|webp|gif)$/.test(file.type))blob=file;else{toast('Bu fotoğraf biçimi okunamadı');continue}
            }
            if(S.assets){
              const r=await S.assets.upload(blob,{type:blob.type&&/^image\//.test(blob.type)?blob.type:'image/jpeg'});
              ex.media.push({k:'asset',t:'image',id:r.id});added.push(r.id);
            }else{
              const src=await blobToData(blob);
              if(JSON.stringify(ex).length+src.length>230000){toast('Bu hareketin fotoğraf alanı doldu');continue}
              ex.media.push({k:'data',t:'image',src:src});
            }
          }
          drawMedia();
        }catch(e){toast('Yüklenemedi'+(e&&e.code?' ('+e.code+')':''))}
      }
      lbl.textContent='Fotoğraf'+(S.assets?' / video':'')+' ekle';lbl.removeAttribute('aria-busy');
    });
    $('#xe-urlbtn',body).onclick=()=>{
      let v=$('#xe-url',body).value.trim();if(!v)return;
      if(!/^https?:\/\//i.test(v))v='https://'+v;
      try{new URL(v)}catch(e){toast('Geçerli bir bağlantı yaz');return}
      ex.media.push({k:'url',t:'link',href:v});$('#xe-url',body).value='';drawMedia();
    };
    sheetOnClose=()=>{if(!saved)added.forEach(dropAsset)};
    $('#xe-save',body).onclick=()=>{
      const name=$('#xe-name',body).value.trim();if(!name){toast('Hareket adı yaz');return}
      const doc={kind:'ex',name:name,muscle:$('#xe-muscle',body).value.trim(),equip:$('#xe-equip',body).value.trim(),sets:$('#xe-sets',body).value.trim(),reps:$('#xe-reps',body).value.trim(),note:$('#xe-note',body).value.trim(),media:ex.media};
      if(JSON.stringify(doc).length>250000){toast('Bu hareket çok büyük. Bazı fotoğrafları kaldır.');return}
      saved=true;
      const keep=new Set(ex.media.filter(m=>m.k==='asset').map(m=>m.id));
      origIds.forEach(x=>{if(!keep.has(x))dropAsset(x)});
      Store.put(id||'ex_'+uid(),doc);
      closeSheet();toast('Kaydedildi');
    };
    const del=$('#xe-del',body);
    if(del)del.onclick=ev=>{
      if(!armed(ev.currentTarget))return;
      saved=true;
      ex.media.filter(m=>m.k==='asset').forEach(m=>dropAsset(m.id));
      added.forEach(a=>{if(!ex.media.some(m=>m.id===a))dropAsset(a)});
      origIds.forEach(x=>{if(!ex.media.some(m=>m.id===x))dropAsset(x)});
      Store.del(id);closeSheet();toast('Hareket silindi');
    };
  });
}

async function saveFile(name,blob){
  try{
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true;
}
/* ---- ayarlar ---- */
function settingsSheet(){
  const g=goals();
  const where=S.assets?'Tüm veriler bu cihazda saklanır, internet gerekmez. Telefonu değiştirirsen ya da tarayıcı verilerini silersen kaybolur. Bu yüzden ara sıra yedek al.':'Tarayıcı depolaması kısıtlı olduğu için veriler sınırlı alanda saklanıyor ve videolar kaydedilemez. Yedek almanı öneririm.';
  openSheet('Ayarlar',
    '<p class="hint" style="margin-top:0">'+esc(where)+'</p>'+
    '<h3>Günlük hedefler</h3>'+
    '<div class="two"><label class="fld"><span>Kalori (kcal)</span><input id="st-k" inputmode="numeric" value="'+g.kcal+'"></label><label class="fld"><span>Protein (g)</span><input id="st-p" inputmode="numeric" value="'+g.p+'"></label></div>'+
    '<div class="two"><label class="fld"><span>Karbonhidrat (g)</span><input id="st-c" inputmode="numeric" value="'+g.c+'"></label><label class="fld"><span>Yağ (g)</span><input id="st-f" inputmode="numeric" value="'+g.f+'"></label></div>'+
    '<button class="link" id="st-calc" type="button">Kaloriyi makrolardan hesapla</button>'+
    '<div class="stack" style="margin-top:8px"><button class="btn primary wide" id="st-save">Hedefleri kaydet</button></div>'+
    '<h3 style="margin-top:26px">Yedek</h3><p class="hint" style="margin-top:0">Hareketlerin, besinlerin, günlük kayıtların ve fotoğraf/videoların tek dosyada iner. Aynı dosyayı geri yükleyebilirsin. Çok video varsa dosya büyük olur.</p>'+
    '<div class="stack">'+'<button class="btn wide" id="st-exp">Yedeği indir</button>'+'<label class="btn wide" for="st-imp">Yedekten geri yükle</label><input class="vh" type="file" id="st-imp" accept="application/json,.json"></div>',
  body=>{
    $('#st-calc',body).onclick=()=>{$('#st-k',body).value=Math.round(nz($('#st-p',body).value)*4+nz($('#st-c',body).value)*4+nz($('#st-f',body).value)*9)};
    $('#st-save',body).onclick=()=>{
      const o={kcal:Math.round(nz($('#st-k',body).value))||DEFAULT_GOALS.kcal,p:Math.round(nz($('#st-p',body).value)),c:Math.round(nz($('#st-c',body).value)),f:Math.round(nz($('#st-f',body).value))};
      Store.put('settings',Object.assign({},S.docs.settings||{kind:'settings',seeded:true},{kind:'settings',goals:o}));
      closeSheet();toast('Hedefler kaydedildi');
    };
    const exp=$('#st-exp',body);
    exp.onclick=async()=>{
      exp.disabled=true;exp.textContent='Hazırlanıyor…';
      try{
        const media={};
        if(Store.idb){
          const keys=await DB.keys('media');
          for(const k of keys){const r=await DB.get('media',k);if(r&&r.blob)media[k]={type:r.type||r.blob.type,data:await blobToData(r.blob)}}
        }
        const blob=new Blob([JSON.stringify({app:'form-defteri',v:2,docs:S.docs,media:media})],{type:'application/json'});
        const ok=await saveFile('form-defteri-yedek-'+ymd(new Date())+'.json',blob);
        if(ok)toast('Yedek hazır');
      }catch(e){toast('Yedek oluşturulamadı')}
      exp.disabled=false;exp.textContent='Yedeği indir';
    };
    $('#st-imp',body).addEventListener('change',async ev=>{
      const f=ev.target.files&&ev.target.files[0];if(!f)return;
      try{
        const o=JSON.parse(await f.text());
        if(!o||o.app!=='form-defteri'||!o.docs)throw new Error('bad');
        const ids=Object.keys(o.docs).filter(k=>/^(ex_|food_|day_)/.test(k)||k==='settings');
        toast('Yükleniyor…');
        if(o.media&&Store.idb){for(const k of Object.keys(o.media)){const m=o.media[k];const b=await (await fetch(m.data)).blob();await DB.put('media',k,{blob:b,type:m.type})}}
        for(const k of ids)await Store.put(k,o.docs[k],{silent:true});
        render();closeSheet();toast(ids.length+' kayıt geri yüklendi');
      }catch(e){toast('Bu dosya geçerli bir yedek değil')}
    });
  });
}

/* ---------- olaylar ---------- */
document.addEventListener('click',ev=>{
  const tab=ev.target.closest('.tab');
  if(tab){S.tab=tab.dataset.tab;render();window.scrollTo(0,0);return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.hasAttribute('data-confirm')&&!armed(el))return;
  const a=el.dataset.act,i=Number(el.dataset.i),j=Number(el.dataset.s);
  switch(a){
    case 'close-sheet':closeSheet();break;
    case 'settings':settingsSheet();break;
    case 'day-prev':S.day=addDays(S.day,-1);render();break;
    case 'day-next':S.day=addDays(S.day,1);render();break;
    case 'day-today':S.day=ymd(new Date());render();break;
    case 'add-food':foodAddSheet(el.dataset.meal);break;
    case 'edit-entry':entrySheet(i);break;
    case 'ex-new':exEditSheet(null);break;
    case 'ex-open':exDetailSheet(el.dataset.id);break;
    case 'ex-filter':S.exF=el.dataset.v||'';render();break;
    case 'food-new':foodEditSheet(null);break;
    case 'food-edit':foodEditSheet(el.dataset.id);break;
    case 'w-add':pickExSheet();break;
    case 'w-copy':{
      const prev=dayIds().filter(x=>x<S.day&&getDay(x).workout.length).pop();
      if(prev){const src=getDay(prev).workout;mutateDay(S.day,d=>{d.workout=src.map(e=>({exId:e.exId,name:e.name,sets:(e.sets||[]).map(s=>({w:s.w,r:s.r,done:false}))}))})}
      break;}
    case 'w-rmex':mutateDay(S.day,d=>{d.workout.splice(i,1)});break;
    case 'w-addset':mutateDay(S.day,d=>{const e=d.workout[i];if(!e)return;const l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:null,r:l?l.r:null,done:false})});break;
    case 'w-rmset':mutateDay(S.day,d=>{const e=d.workout[i];if(e&&e.sets.length>1)e.sets.pop()});break;
    case 'w-done':mutateDay(S.day,d=>{const s=d.workout[i]&&d.workout[i].sets[j];if(s)s.done=!s.done});break;
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheetRoot').hidden)closeSheet()});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='exSearch'){S.exQ=t.value;renderExList()}
  else if(t.id==='foodSearch'){S.foodQ=t.value;renderFoodList()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.classList&&t.classList.contains('si')){
    const i=Number(t.dataset.i),j=Number(t.dataset.s),f=t.dataset.f;
    mutateDay(S.day,d=>{const s=d.workout[i]&&d.workout[i].sets[j];if(s)s[f]=num(t.value)},{silent:true});
  }else if(t.id==='weightInput'){
    const v=num(t.value);
    mutateDay(S.day,d=>{d.weight=v},{silent:true});
  }
});
$('#view').addEventListener('focusout',()=>{setTimeout(()=>{if(S.pending&&!isEditing()){S.pending=false;render()}},60)});

/* ---------- başlatma ---------- */
function setupPWA(){
  try{
    const m={name:'Form Defteri',short_name:'Form Defteri',lang:'tr',start_url:location.href.split('#')[0].split('?')[0],display:'standalone',background_color:'#0E1215',theme_color:'#ECEFF2',
      icons:[{src:ICON192,sizes:'192x192',type:'image/png',purpose:'any'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    const l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){}
}
async function boot(){
  render();
  let ok=false;
  try{DB.db=await DB.open();S.docs=await DB.all('docs');Store.idb=true;ok=true}catch(e){}
  if(ok){
    S.assets={
      upload(blob,opt){
        const t=opt&&opt.type;const b=t&&t!==blob.type?new Blob([blob],{type:t}):blob;
        const id=uid()+uid();
        return DB.put('media',id,{blob:b,type:b.type}).then(()=>({id:id}));
      },
      delete(id){if(URLS[id]){try{URL.revokeObjectURL(URLS[id])}catch(e){}delete URLS[id];delete URLP[id]}return DB.del('media',id)}
    };
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }else{
    S.docs=loadLocal();
  }
  setStatus('local');
  if(!S.docs.settings){await seed()}
  render();hydrate();
  setupPWA();
}
boot();
})();
